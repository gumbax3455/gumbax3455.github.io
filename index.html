<!DOCTYPE html>
<html lang="de">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latein Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-layer">
        <div class="side grammar" onclick="window.location.href='grammatik.html'">
            <h2>Grammatik</h2>
        </div>
        <div class="side cards" onclick="window.location.href='karteikarten.html'">
            <h2>Karteikarten</h2>
        </div>

        <div class="container">

            <input type="text" 
                   id="searchInput" 
                   placeholder="Suche (z. B. 'amare')..."

        </div>
    </div>

    <script src="dictionary.js"></script>
