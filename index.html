<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latin Learning Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-layout">
        <div class="side-zone left" onclick="window.location.href='grammar.html'">
            <span>Grammatik</span>
        </div>

        <div class="center-zone">
            <div class="container">
                <h1>Wörterbuch</h1>
                <div id="status">Wird geladen...</div>
                
                <input type="text" 
                       id="searchInput" 
                       placeholder="Suche (z. B. 'amare')..." 
                       autocomplete="off">
                       
                <div id="result"></div>
            </div>
        </div>

        <div class="side-zone right" onclick="window.location.href='culture.html'">
            <span>Kultur & Geschichte</span>
        </div>
    </div>

    <script src="dictionary.js"></script>
</body>
</html>
