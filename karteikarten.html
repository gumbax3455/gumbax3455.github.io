<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Lernen - Latin Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flashcard-mode">
    <div class="kk-shell">
        <header class="kk-top-nav">
            <div class="kk-nav-left" style="grid-area: left;">
                <button class="back-btn" onclick="handleBack()">Zurück</button>
            </div>
            
            <nav aria-label="Primary" id="main-tabs-container" style="grid-area: title; justify-self: center;">
                <ul class="tabs-nav" id="main-tabs">
                    <li class="active" onclick="switchTab('tab-overview', this)">Übersicht</li>
                    <li onclick="switchTab('tab-omni', this)">Omnireview</li>
                    <li onclick="switchTab('tab-search', this)">Suche</li>
                </ul>
            </nav>
            <h1 class="kk-nav-title hidden" id="nav-title" style="grid-area: title; justify-self: center;">Latein Lektionen</h1>
            
            <div style="grid-area: right; justify-self: end;"></div>
        </header>

        <div id="menu-view" class="kk-view">
            <!-- Tab 1: Overview -->
            <div id="tab-overview" class="tab-panel active-panel">
                <div class="deck-list" id="deck-list-container">
                    <!-- populated by JS -->
                </div>
            </div>

            <!-- Tab 2: Omnireview -->
            <div id="tab-omni" class="tab-panel">
                <div class="omni-controls">
                    <h2 style="color: #fff; font-size: 1.2rem;">Decks für Omnireview wählen</h2>
                    <button class="omni-start-btn" id="omni-start-btn" onclick="startOmnireview()" disabled>Start (0)</button>
                </div>
                <div class="omni-grid" id="omni-deck-grid">
                    <!-- populated by JS -->
                </div>
            </div>

            <!-- Tab 3: Search -->
            <div id="tab-search" class="tab-panel">
                <input type="text" id="global-search-input" class="deck-search-pill" placeholder="Wörter suchen..." style="width: 100%; max-width: none; margin-bottom: 20px;">
                <div class="deck-card-list" id="global-search-results" style="flex-wrap: wrap;">
                    <!-- populated by JS -->
                </div>
            </div>
        </div>

        <div id="deck-overview-view" class="kk-view hidden">
            <section class="dashboard-grid">
                <article class="dashboard-card grade-card">
                    <p class="dashboard-label">Note</p>
                    <div id="grade-value" class="grade-value">0%</div>
                    <p class="muted-text" id="grade-caption">Beherrschte Karten</p>
                </article>
                <article class="dashboard-card bar-card">
                    <p class="dashboard-label">Lernstufen</p>
                    <div id="srs-bars" class="srs-bars"></div>
                </article>
            </section>

            <section class="gallery-shell">
                <div class="gallery-top-row">
                    <input id="deck-search-input" class="deck-search-pill" type="text" placeholder="In dieser Lektion suchen..." autocomplete="off">
                    <div class="gallery-counter" id="deck-card-count">0/0</div>
                </div>
                <div class="gallery-header">Karten</div>
                <div id="deck-card-list" class="deck-card-list"></div>
            </section>

            <button class="lernen-floating-btn" onclick="startLearningFromOverview()">> Wiederholung</button>
        </div>

        <div id="session-view" class="kk-view hidden">
            <div class="card-stack">
                <div class="progress-label" id="progress-label">0/0</div>
                <div class="card" id="flashcard" onclick="flipCard()">
                    <div class="card-face card-front">
                        <h2 id="wordFront">Lade...</h2>
                        <p style="color:#888; margin-top:15px; font-size: 0.8rem;">Klicken zum Umdrehen</p>
                    </div>
                    <div class="card-face card-back">
                        <h2 id="wordBack">...</h2>
                        <div id="merkhilfe-container" class="merkhilfe"></div>
                    </div>
                </div>
            </div>
            <div class="controls hidden" id="controls">
                <button class="btn-rate btn-again" onclick="rateCard(1)">Again</button>
                <button class="btn-rate btn-hard" onclick="rateCard(2)">Hard</button>
                <button class="btn-rate btn-good" onclick="rateCard(3)">Good</button>
                <button class="btn-rate btn-easy" onclick="rateCard(4)">Easy</button>
            </div>
        </div>
    </div>

    <script src="csv.js"></script>
    <script src="karteikarten.js"></script>
</body>
</html>
