<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Lernen - Latin Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flashcard-mode">

    <button class="back-btn" style="position:fixed; top:20px; left:20px; z-index:100;" onclick="handleBack()">← Zurück</button>

    <div id="menu-view">
        <h1>Was möchtest du lernen?</h1>
        <div id="deck-overview" class="deck-overview">
            <h2 id="overview-title">Alle Lektionen</h2>
            <div class="overview-grid">
                <div class="overview-item"><span>Gesamt</span><strong id="overview-total">0</strong></div>
                <div class="overview-item overview-new"><span>Neu</span><strong id="overview-new">0</strong></div>
                <div class="overview-item overview-due"><span>Faellig/Problem</span><strong id="overview-due">0</strong></div>
                <div class="overview-item overview-mature"><span>Reif</span><strong id="overview-mature">0</strong></div>
            </div>
        </div>
        <div class="chapter-list">
            <button class="chapter-btn omnireview-btn" onclick="startSession('all')">Omnireview (Alles)</button>
            <div id="chapter-buttons">
                </div>
        </div>
    </div>

    <div id="deck-overview-view" class="hidden">
        <div class="deck-detail-header">
            <button class="deck-detail-back-btn" onclick="closeDeckOverview()">← Zurück</button>
            <h2 id="deck-detail-title">Lektion</h2>
        </div>

        <div class="deck-detail-toolbar">
            <input id="deck-search-input" type="text" placeholder="Karten in dieser Lektion suchen..." autocomplete="off">
        </div>

        <div id="deck-card-list" class="deck-card-list"></div>
        <button class="lernen-floating-btn" onclick="startLearningFromOverview()">Lernen</button>
    </div>

    <div id="session-view" class="hidden">
        <div class="card-stack">
            <div class="progress-label" id="progress-label">0/0</div>
            <div class="card" id="flashcard" onclick="flipCard()">
                <div class="card-face card-front">
                    <h2 id="wordFront">Lade...</h2>
                    <p style="color:#aaa; margin-top:15px; font-size: 0.8rem;">Klicken zum Umdrehen</p>
                </div>
                <div class="card-face card-back">
                    <h2 id="wordBack">...</h2>
                    <div id="merkhilfe-container" class="merkhilfe"></div>
                </div>
            </div>
        </div>
        <div class="controls hidden" id="controls">
            <button class="btn-rate btn-again" onclick="rateCard(1)">Again</button>
            <button class="btn-rate btn-hard" onclick="rateCard(2)">Hard</button>
            <button class="btn-rate btn-good" onclick="rateCard(3)">Good</button>
            <button class="btn-rate btn-easy" onclick="rateCard(4)">Easy</button>
        </div>
    </div>

    <script src="csv.js"></script>
    <script src="karteikarten.js"></script>
</body>
</html>
