<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Karteikarten</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flashcard-mode">
    <button class="back-btn" onclick="window.location.href='index.html'">← Zurück</button>

    <div class="card-stack">
        <div class="card" id="flashcard" onclick="flipCard()">
            <div class="card-face card-front">
                <h2 id="wordFront">Lade...</h2>
                <p style="color:#aaa; margin-top:10px;">Klicken zum Umdrehen</p>
            </div>
            <div class="card-face card-back">
                <h2 id="wordBack">...</h2>
            </div>
        </div>
    </div>

    <div class="controls hidden" id="controls">
        <button class="btn-next" onclick="nextCard()">Nächste Karte →</button>
    </div>

    <script src="karteikarten.js"></script>
</body>
</html>
